
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Archives</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- STATIONARY TOP HEADER -->
    <header class="top-header">
        <div class="brand">
            

<img src="./first_logo.png"
     alt="FIRST Robotics logo"
     class="first-logo">



            <span class="brand-title">Community Archives</span>
        </div>

        <nav aria-label="Main navigation">
            <button id="timeline-button" class="nav-button active">
                Timeline
            </button>

            <button id="teams-button" class="nav-button">
                Original Teams
            </button>
        </nav>
    </header>

    <!-- PAGE CONTENT -->
    <main>
        <!-- TIMELINE -->
        <section id="timeline-page" class="page">
            <h1 class="page-title">Timeline</h1>

            <div class="timeline">
                <div class="timeline-line"></div>
                <div id="timeline-events"></div>
            </div>
        </section>

        <!-- ORIGINAL AND SUSTAINING TEAMS -->
        <section id="teams-page" class="page" hidden>
            <h1 class="page-title">Original and Sustaining Teams</h1>

            <div class="team-panel">

                <!-- IMAGE COLLAGE / CAROUSEL -->
                <div class="collage-column">
                    <div class="collage-window">
                        <div id="collage-track" class="collage-track">
                            <!-- JavaScript inserts the images here -->
                        </div>
                    </div>

                    <button
                        id="previous-team"
                        class="carousel-arrow previous"
                        aria-label="Previous team">
                        ◀
                    </button>

                    <button
                        id="next-team"
                        class="carousel-arrow next"
                        aria-label="Next team">
                        ▶
                    </button>
                </div>

                <!-- TEAM INFORMATION -->
                <article id="team-information" class="team-information">
                    <!-- JavaScript updates this with the selected team -->
                </article>

            </div>

            <p class="team-counter" id="team-counter"></p>
        </section>
    </main>

    <!-- STATIONARY BOTTOM HEADER / FOOTER -->
    
<footer class="bottom-footer">
    <a href="credits.html">Credits</a>
    <a href="contact.html">Contact</a>
    <a href="link-tree.html">Link Tree</a>
</footer>


    <script src="script.js"></script>
</body>
</html>
